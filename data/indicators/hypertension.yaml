id: hypertension
name: 高血压
category: 心血管
unit: mmHg
reference:
  normal: "<120/80"
  elevated: "120-139/80-89"
  high: ">=140/90"
  urgent: ">=180/120"
grades:
  green: "正常，保持"
  yellow: "临界/轻度异常，生活方式干预"
  red: "明显异常，建议尽快就医"
red_flags:
  - "血压达到或超过 180/120 mmHg"
  - "胸痛、胸闷或呼吸困难"
  - "剧烈头痛或视物模糊"
  - "说话不清、嘴歪或一侧手脚无力"
diet_general:
  principles:
    - "保持饮食规律，以天然、少加工食物为主"
    - "每天盐少于 5 克（包括酱油、酱料和加工食品中的盐）"
  eat_more:
    - "蔬菜、水果、全谷物和豆类"
    - "在个人情况允许时选择低脂奶或其他低脂蛋白来源"
  eat_less:
    - "加工肉、肥肉、油炸食品"
    - "腌制品、方便食品和高盐酱料"
  cautions:
    - "如合并肾病、心衰或需要限制钾摄入，饮食方案应先由医生或营养师评估"
diet_vegetarian:
  - "避免高盐素鸡、素肉、腐乳和咸豆干"
  - "用醋、柠檬、蒜和香草增加风味，减少盐和高钠酱料"
exercise:
  aerobic: "在医生确认适合运动后，每周累计 150 分钟中等强度有氧运动，循序渐进"
  strength: "每周 2 次力量训练，避免憋气用力"
  flexibility_balance: "每周安排柔韧与平衡练习，可从每次 10 分钟开始"
  contraindications: "血压达到紧急阈值、出现胸痛/气短/神经系统症状时停止运动并立即就医；避免清晨血压高峰时剧烈运动"
sleep_stress:
  - "尽量保证每晚 7-8 小时睡眠，保持规律作息"
  - "可使用缓慢呼吸、散步或正念练习管理压力"
  - "如经常打鼾、憋醒或白天嗜睡，建议就医评估睡眠呼吸暂停"
monitoring:
  home: "在安静休息后按规范早晚测量并记录血压；具体频率遵医嘱"
  review_items: "血压记录及医生结合病史建议的相关检查（TODO：待医生评估）"
  review_time: "生活方式干预后可与医生商定复查时间；示例资料为每 3 个月复查"
disclaimer: "本方案为健康管理参考，不替代医生诊断、治疗和用药建议。"

